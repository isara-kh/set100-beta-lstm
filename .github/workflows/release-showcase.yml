name: release-showcase

# Pushing a content tag (showcase-v1, showcase-v2, ...) publishes the Content
# Contract in showcase/ as a GitHub release asset and prints its sha256 for the
# Portfolio Site's registry. Content tags are separate from the package version.
# Only the built-in GITHUB_TOKEN is used: no secrets, no Deploy Hook, and no
# call to the Portfolio Site.

on:
  push:
    tags:
      - "showcase-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # The notebook group is skipped: nothing here launches Jupyter.
        run: uv sync --no-group notebook

      - name: Run the invariant suite
        run: uv run python -m pytest -q

      - name: Check the showcase export is fresh
        # Same check as tests.yml: a stale export must never be released.
        env:
          MPLBACKEND: Agg
        run: |
          uv run python -m betaforecast.showcase
          git diff --exit-code showcase/
          untracked="$(git status --porcelain showcase/)"
          if [ -n "$untracked" ]; then
            echo "showcase/ has uncommitted changes after the export:" >&2
            echo "$untracked" >&2
            exit 1
          fi

      - name: Build showcase.tar.gz
        # Equivalent to `tar -czf showcase.tar.gz showcase/` (top-level showcase/),
        # but made reproducible so the same content always yields the same sha256
        # for the site's registry: sorted entries, a fixed mtime, root ownership,
        # and `gzip -n` to leave the timestamp and file name out of the gzip header.
        run: |
          tar --sort=name --mtime='UTC 2020-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -cf - showcase/ | gzip -n > showcase.tar.gz
          tar -tzf showcase.tar.gz

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" showcase.tar.gz \
            --verify-tag \
            --title "$TAG" \
            --notes "Content Contract release \`$TAG\`: \`showcase.tar.gz\` unpacks to a top-level \`showcase/\` folder. The sha256 is printed in the release job summary."

      - name: Print the checksum
        run: |
          sha256sum showcase.tar.gz | tee -a "$GITHUB_STEP_SUMMARY"
